<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19] text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CardCrop" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Ultra-fast, zero-latency Card Cropper, Descratcher & Enhancer featuring custom WebGL fragment shaders, hybrid edge detection, Navier-Stokes inpainting, optimistic previews, and 2026 Liquid Glass UI." />
    <meta property="og:title" content="Card Cropper, Descratcher & Enhancer" />
    <meta property="og:description" content="Ultra-fast, zero-latency Card Cropper, Descratcher & Enhancer featuring custom WebGL fragment shaders, hybrid edge detection, Navier-Stokes inpainting, optimistic previews, and 2026 Liquid Glass UI." />
    <title>Card Cropper, Descratcher & Enhancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0b0f19;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
    </style>
  </head>
  <body class="h-full bg-[#0b0f19] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
