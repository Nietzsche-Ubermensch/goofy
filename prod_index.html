<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="module">import { injectIntoGlobalHook } from "/@react-refresh";
injectIntoGlobalHook(window);
window.$RefreshReg$ = () => {};
window.$RefreshSig$ = () => (type) => type;</script>

    <script type="module" src="/@vite/client"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardCrop AI Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050510;
        color: #c7d1d9;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050510;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 243, 255, 0.3);
        border: 1px solid rgba(0, 243, 255, 0.5);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 243, 255, 0.6);
      }
      /* Holographic Effects */
      .holo-panel {
        background: linear-gradient(135deg, rgba(16, 20, 35, 0.6) 0%, rgba(5, 5, 10, 0.8) 100%);
        box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1), 0 0 15px rgba(0, 243, 255, 0.05);
        border: 1px solid rgba(0, 243, 255, 0.2);
        backdrop-filter: blur(12px);
      }
      .holo-border {
        border: 1px solid rgba(0, 243, 255, 0.3);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 5px rgba(0, 243, 255, 0.1);
      }
      .holo-border-magenta {
        border: 1px solid rgba(255, 0, 229, 0.3);
        box-shadow: 0 0 10px rgba(255, 0, 229, 0.2), inset 0 0 5px rgba(255, 0, 229, 0.1);
      }
      .holo-text {
        color: #00f3ff;
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
      }
      input[type="text"], input[type="password"], select {
         background: rgba(0, 21, 41, 0.5) !important;
         border: 1px solid rgba(0, 243, 255, 0.3) !important;
         color: #00f3ff !important;
         font-family: 'JetBrains Mono', monospace;
      }
      input[type="text"]:focus, input[type="password"]:focus, select:focus {
         border-color: #00f3ff !important;
         box-shadow: 0 0 12px rgba(0, 243, 255, 0.5) !important;
      }
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.5;
      }
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 9998;
      }
      .holo-button {
          background: rgba(0, 243, 255, 0.1);
          border: 1px solid rgba(0, 243, 255, 0.5);
          color: #00f3ff;
          text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
          box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
          transition: all 0.2s ease;
      }
      .holo-button:hover:not(:disabled) {
          background: rgba(0, 243, 255, 0.3);
          box-shadow: 0 0 20px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(0, 243, 255, 0.4);
      }
      .holo-button:disabled {
          opacity: 0.5;
          filter: grayscale(1);
          cursor: not-allowed;
      }
      @keyframes bg-pan {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }
      @keyframes scanline {
        0% { top: -5%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 105%; opacity: 0; }
      }
      .animate-scanline {
        animation: scanline 2.2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#0b0c0e] text-slate-200">
    <div id="error-log" style="color: red; position: fixed; top: 0; left: 0; z-index: 99999; background: black; padding: 10px; display: none;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += '<p>' + msg + ' at ' + url + ':' + lineNo + ':' + columnNo + '</p>';
        if (error && error.stack) {
          log.innerHTML += '<pre>' + error.stack + '</pre>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += '<p>Unhandled Promise Rejection: ' + event.reason + '</p>';
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
